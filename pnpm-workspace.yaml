packages:
  - 'apps/*'
  - 'packages/*'
  # The test suite is a workspace project so `pnpm -r typecheck` and
  # `pnpm run lint` actually reach it. It used to sit outside the workspace,
  # which meant ~2 200 lines of test code were never type-checked and never
  # linted — a type error in a test surfaced only when that test happened to
  # run.
  - 'test'
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260915.1'
  # The kit is published in lockstep and this repo tracks it deliberately, so
  # the release-age gate is lifted for the version it pins.
  - '@rexezuge/d1@1.9.0'
  - '@rexezuge/errors@1.9.0'
  - '@rexezuge/http@1.9.0'
  - '@rexezuge/i18n@1.9.0'
  - '@rexezuge/identity@1.9.0'
  - '@rexezuge/runtime@1.9.0'
  - '@rexezuge/shared@1.9.0'
  - '@rexezuge/tooling@1.9.0'
  - '@rexezuge/web@1.9.0'

patchedDependencies:
  dofs@0.1.0: patches/dofs@0.1.0.patch
